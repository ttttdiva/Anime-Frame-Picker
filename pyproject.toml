[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-frame-picker"
version = "0.1.0"
description = "Local, frame-accurate anime reference and scene search"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "av>=14,<20",
  "pillow>=11,<13",
  "numpy>=1.26,<2",
  "opencv-contrib-python==4.11.0.86",
  "opencv-python-headless==4.11.0.86",
  "dghs-imgutils[gpu]==0.19.0",
  "torch==2.9.1+cu128",
  "torchvision==0.24.1+cu128",
  "transformers>=4.49,<5",
  "timm>=1.0.14,<2",
  "safetensors>=0.5,<1",
  "accelerate>=1.3,<2",
  "huggingface-hub>=0.27,<1",
  "onnxruntime-gpu==1.23.2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.setuptools]
packages = ["anime_picker"]

[tool.setuptools.package-data]
anime_picker = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
